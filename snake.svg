<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="100%" height="150" fill="none">
  <defs>
    <!-- Cyber Neon Glow Filters -->
    <filter id="snakeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00FF66" />
    </linearGradient>
  </defs>

  <style>
    .grid-bg { fill: #0d1117; stroke: #1e293b; stroke-width: 1.5; }
    .hud-title { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #00FF66; letter-spacing: 1px; }
    .hud-sub { font-family: 'Fira Code', monospace; font-size: 11px; fill: #64748b; }
    
    /* Snake slither animation across grid */
    @keyframes crawlX {
      0%   { transform: translate(45px, 60px); }
      25%  { transform: translate(320px, 60px); }
      50%  { transform: translate(580px, 88px); }
      75%  { transform: translate(750px, 74px); }
      100% { transform: translate(840px, 60px); }
    }

    .snake-body {
      animation: crawlX 14s linear infinite alternate;
    }
  </style>

  <!-- Container Box -->
  <rect width="880" height="150" rx="12" class="grid-bg" />

  <!-- Header HUD -->
  <g transform="translate(30, 26)">
    <circle cx="5" cy="-4" r="3.5" fill="#00FF66" filter="url(#snakeGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="0" class="hud-title">CYBER_SNAKE // CONTRIBUTION MATRIX FEEDER</text>
    <text x="820" y="0" class="hud-sub" text-anchor="end">STATUS: <tspan fill="#00FF66" font-weight="bold">ACTIVE_HARVEST</tspan></text>
  </g>

  <!-- Grid of Contribution Cells -->
  <g transform="translate(30, 48)">
    <!-- Column 1-52 subtle contribution cells simulation -->
    <!-- Rows 1 to 7 -->
    <g fill="#161b22">
      <!-- Repeated procedural grid -->
      <rect x="0" y="0" width="11" height="11" rx="2.5" />
      <rect x="0" y="14" width="11" height="11" rx="2.5" />
      <rect x="0" y="28" width="11" height="11" rx="2.5" fill="#0e2a3a" />
      <rect x="0" y="42" width="11" height="11" rx="2.5" />
      <rect x="0" y="56" width="11" height="11" rx="2.5" fill="#004d40" />
      <rect x="0" y="70" width="11" height="11" rx="2.5" />

      <rect x="15" y="0" width="11" height="11" rx="2.5" />
      <rect x="15" y="14" width="11" height="11" rx="2.5" fill="#00F2FE" opacity="0.6" />
      <rect x="15" y="28" width="11" height="11" rx="2.5" />
      <rect x="15" y="42" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.4" />
      <rect x="15" y="56" width="11" height="11" rx="2.5" />
      <rect x="15" y="70" width="11" height="11" rx="2.5" />

      <rect x="30" y="0" width="11" height="11" rx="2.5" />
      <rect x="30" y="14" width="11" height="11" rx="2.5" />
      <rect x="30" y="28" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.8" />
      <rect x="30" y="42" width="11" height="11" rx="2.5" fill="#38BDF8" opacity="0.7" />
      <rect x="30" y="56" width="11" height="11" rx="2.5" />
      <rect x="30" y="70" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.5" />

      <!-- Segment markers across width -->
      <rect x="80" y="28" width="11" height="11" rx="2.5" fill="#00F2FE" opacity="0.8" />
      <rect x="95" y="42" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.9" />
      <rect x="140" y="14" width="11" height="11" rx="2.5" fill="#38BDF8" opacity="0.7" />
      <rect x="185" y="56" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.9" />
      <rect x="230" y="28" width="11" height="11" rx="2.5" fill="#00F2FE" opacity="0.7" />
      <rect x="275" y="42" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.8" />
      <rect x="340" y="14" width="11" height="11" rx="2.5" fill="#00F2FE" opacity="0.9" />
      <rect x="385" y="70" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.8" />
      <rect x="440" y="28" width="11" height="11" rx="2.5" fill="#38BDF8" opacity="0.8" />
      <rect x="495" y="42" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.9" />
      <rect x="550" y="14" width="11" height="11" rx="2.5" fill="#00F2FE" opacity="0.9" />
      <rect x="610" y="56" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.8" />
      <rect x="670" y="28" width="11" height="11" rx="2.5" fill="#38BDF8" opacity="0.7" />
      <rect x="730" y="42" width="11" height="11" rx="2.5" fill="#00FF66" opacity="0.9" />
      <rect x="790" y="14" width="11" height="11" rx="2.5" fill="#00F2FE" opacity="0.8" />
    </g>

    <!-- Faint dots across full matrix -->
    <path d="M 50 5 L 820 5 M 50 19 L 820 19 M 50 33 L 820 33 M 50 47 L 820 47 M 50 61 L 820 61 M 50 75 L 820 75" stroke="#161b22" stroke-width="6" stroke-dasharray="11 4" stroke-linecap="round"/>

    <!-- Slithering Snake Creature -->
    <g class="snake-body" filter="url(#snakeGlow)">
      <!-- Snake Tail -->
      <circle cx="-36" cy="0" r="4.5" fill="#00F2FE" opacity="0.4" />
      <circle cx="-24" cy="0" r="5" fill="#00F2FE" opacity="0.6" />
      <circle cx="-12" cy="0" r="5.5" fill="#38BDF8" opacity="0.8" />
      <!-- Snake Body -->
      <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#00FF66" />
      <rect x="8" y="-6" width="12" height="12" rx="3" fill="#00FF66" />
      <!-- Snake Head -->
      <rect x="22" y="-6.5" width="13" height="13" rx="3.5" fill="#ffffff" stroke="#00FF66" stroke-width="1.5" />
      <!-- Eyes -->
      <circle cx="30" cy="-3" r="1.5" fill="#000000" />
      <circle cx="30" cy="3" r="1.5" fill="#000000" />
    </g>
  </g>
</svg>
