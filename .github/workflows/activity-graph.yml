name: Update Activity Oscilloscope

on:
  schedule:
    - cron: "0 18 * * *" # Runs daily
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Oscilloscope SVG
        run: node generate_oscilloscope.mjs

      - name: Commit and Push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add activity-graph.svg
          git commit -m "chore: update activity oscilloscope" || exit 0
          git push
