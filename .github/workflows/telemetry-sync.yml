name: Sync Telemetry & Profile Hologram

on:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 18:00 UTC
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Activity Oscilloscope SVG
        run: node generate_oscilloscope.mjs

      - name: Generate 3D Profile Contrib Hologram
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate Cyber Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake.svg?color_snake=#00FF66&color_dots=#0d1117,#0e1a2e,#00F2FE,#38BDF8,#00FF66

      - name: Commit & Push Telemetry Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A activity-graph.svg profile-3d-contrib/ snake.svg
          git commit -m "chore: synchronize telemetry HUD assets [skip ci]" || exit 0
          git push
