name: ✍️ Sign Guestbook
description: Leave a message on Nithin's GitHub profile!
title: "guestbook: sign"
labels: ["guestbook"]
body:
  - type: markdown
    attributes:
      value: |
        ### Welcome to my profile! 👋
        Leave a short message, say hi, or share feedback on my work. Your message will be posted automatically on my GitHub profile page!
  - type: textarea
    id: message
    attributes:
      label: Your Message
      placeholder: "Awesome profile! Loved the portfolio at nithin.akao.in 🚀"
    validations:
      required: true
