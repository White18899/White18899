<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%" fill="none">
  <defs>
    <!-- Neon Gradient for Oscilloscope Area -->
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.00" />
    </linearGradient>

    <!-- Line Stroke Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Fira Code', monospace, sans-serif; font-size: 13px; font-weight: 700; fill: #00FF66; letter-spacing: 1px; }
    .stat-text { font-family: 'Fira Code', monospace, sans-serif; font-size: 12px; fill: #94a3b8; }
    .grid-line { stroke: #1e293b; stroke-dasharray: 4 6; stroke-width: 1; }
  </style>

  <!-- Background Panel -->
  <rect width="880" height="260" rx="12" fill="#0d1117" stroke="#1f2937" stroke-width="1.5" />

  <!-- Oscilloscope Grid Lines -->
  <line x1="45" y1="65" x2="845" y2="65" class="grid-line" />
  <line x1="45" y1="114.5" x2="845" y2="114.5" class="grid-line" />
  <line x1="45" y1="164" x2="845" y2="164" class="grid-line" />
  <line x1="45" y1="215" x2="845" y2="215" stroke="#334155" stroke-width="1.5" />

  <!-- Header HUD -->
