<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="290" fill="none">
  <defs>
    <!-- Cyan to Neon Green Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1f2937" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00FF66" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .term-font { font-family: 'Fira Code', 'SF Mono', Consolas, Monaco, monospace; }
    .term-title { font-size: 12px; fill: #94a3b8; font-weight: 500; letter-spacing: 0.5px; }
    .prompt-user { font-size: 13px; font-weight: 700; fill: #00FF66; }
    .prompt-path { font-size: 13px; font-weight: 700; fill: #00F2FE; }
    .prompt-cmd  { font-size: 13px; font-weight: 500; fill: #f8fafc; }
    
    .label { font-size: 12px; font-weight: 700; fill: #00F2FE; letter-spacing: 0.5px; }
    .val   { font-size: 12px; font-weight: 500; fill: #e2e8f0; }
    .sub   { font-size: 11px; fill: #64748b; }
    .tag   { font-size: 10px; font-weight: 700; fill: #38BDF8; }
    .link  { font-size: 12px; font-weight: 600; fill: #38BDF8; }
    .status-online { font-size: 11px; font-weight: 700; fill: #00FF66; letter-spacing: 0.5px; }

    /* Blinking Terminal Cursor */
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: cursorBlink 1s infinite; fill: #00FF66; }

    /* Rotating HUD Radar Ring */
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .rotating-ring {
      transform-origin: 120px 165px;
      animation: radarSpin 24s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="290" rx="14" fill="#0d1117" stroke="url(#neonBorder)" stroke-width="1.5" />

  <!-- Terminal Window Bar -->
  <path d="M0 14 C0 6.268 6.268 0 14 0 L866 0 C873.732 0 880 6.268 880 14 L880 38 L0 38 Z" fill="#161b22" />
  <line x1="0" y1="38" x2="880" y2="38" stroke="#21262d" stroke-width="1" />

  <!-- Window Action Buttons -->
  <g transform="translate(20, 19)">
    <circle cx="0" cy="0" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="16" cy="0" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="32" cy="0" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
  </g>

  <!-- Title -->
  <text x="440" y="24" text-anchor="middle" class="term-font term-title">operator@vajra-hub: ~ (zsh) — fastfetch</text>

  <!-- Terminal Command Execution Line -->
  <g transform="translate(30, 64)" class="term-font">
    <text class="prompt-user">white@vajra-hub</text>
    <text x="118" y="0" fill="#64748b">:</text>
    <text x="126" y="0" class="prompt-path">~</text>
    <text x="135" y="0" fill="#64748b">$</text>
    <text x="148" y="0" class="prompt-cmd">fastfetch --hud --operator-specs</text>
  </g>

  <!-- Left Column: Holographic Operator Crest & Radar -->
  <g id="operator-crest">
    <!-- Ambient Backing Glow -->
    <circle cx="120" cy="165" r="52" fill="#00F2FE" fill-opacity="0.03" />
    
    <!-- Rotating Dashed Radar Ring -->
    <circle cx="120" cy="165" r="56" stroke="#00F2FE" stroke-width="1.2" stroke-dasharray="6 5" class="rotating-ring" opacity="0.6" />
    <circle cx="120" cy="165" r="44" stroke="#1e293b" stroke-width="1" />

    <!-- Central Diamond & Circuit Nodes -->
    <polygon points="120,128 152,165 120,202 88,165" stroke="url(#crestGrad)" stroke-width="1.8" fill="#00FF66" fill-opacity="0.06" filter="url(#softGlow)" />
    
    <!-- Crosshairs -->
    <line x1="98" y1="165" x2="142" y2="165" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="120" y1="143" x2="120" y2="187" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Core Reactor Dot -->
    <circle cx="120" cy="165" r="4.5" fill="#00FF66" filter="url(#hudGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="165" r="2" fill="#ffffff" />

    <!-- Labeling Under Crest -->
    <text x="120" y="235" text-anchor="middle" class="term-font" font-size="11" font-weight="700" fill="#00F2FE" letter-spacing="1.5">VAJRA // OPERATOR</text>
    <text x="120" y="250" text-anchor="middle" class="term-font" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1">CLEARANCE: LEVEL 4</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="230" y1="84" x2="230" y2="265" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Right Column: Specs Table -->
  <g transform="translate(254, 94)" class="term-font">
    
    <!-- Row 1: Operator -->
    <g transform="translate(0, 0)">
      <text class="label">OPERATOR</text>
      <text x="125" y="0" fill="#64748b">→</text>
      <text x="145" y="0" class="val">Nithin <tspan class="sub">(Full-Stack Architect &amp; Creative Technologist)</tspan></text>
    </g>

    <!-- Row 2: Studio / Lab -->
    <g transform="translate(0, 24)">
      <text class="label">STUDIO</text>
      <text x="125" y="0" fill="#64748b">→</text>
      <text x="145" y="0" class="val">Vajra Hub <tspan class="sub">• Creative Engineering &amp; Web Systems</tspan></text>
    </g>

    <!-- Row 3: Base Coordinates -->
    <g transform="translate(0, 48)">
      <text class="label">BASE_HQ</text>
      <text x="125" y="0" fill="#64748b">→</text>
      <text x="145" y="0" class="val">Gopalapatnam, India <tspan class="tag">[17.75°N, 83.22°E]</tspan></text>
    </g>

    <!-- Row 4: Digital HQ -->
    <g transform="translate(0, 72)">
      <text class="label">DIGITAL_HQ</text>
      <text x="125" y="0" fill="#64748b">→</text>
      <text x="145" y="0" class="link">https://nithin.akao.in</text>
    </g>

    <!-- Row 5: Tech Weapons -->
    <g transform="translate(0, 96)">
      <text class="label">TECH_STACK</text>
      <text x="125" y="0" fill="#64748b">→</text>
      <text x="145" y="0" class="val">TypeScript, React 19, Next.js, Node.js, Tailwind, MongoDB</text>
    </g>

    <!-- Row 6: Status & Mission -->
    <g transform="translate(0, 120)">
      <text class="label">TELEMETRY</text>
      <text x="125" y="0" fill="#64748b">→</text>
      <text x="145" y="0" class="status-online">🟢 99.9% UPTIME // AVAILABLE FOR CONTRACTS &amp; PROJECTS</text>
    </g>

    <!-- Row 7: Prompt line & Color blocks -->
    <g transform="translate(0, 150)">
      <!-- Next Prompt line -->
      <text class="prompt-user" font-size="12">white@vajra-hub</text>
      <text x="108" y="0" fill="#64748b" font-size="12">:</text>
      <text x="116" y="0" class="prompt-path" font-size="12">~</text>
      <text x="125" y="0" fill="#64748b" font-size="12">$</text>
      <rect x="138" y="-10" width="8" height="13" class="cursor" />

      <!-- Neofetch Palette Color Blocks -->
      <g transform="translate(390, -10)">
        <rect x="0" y="0" width="16" height="10" rx="2" fill="#0d1117" stroke="#21262d" />
        <rect x="20" y="0" width="16" height="10" rx="2" fill="#ef4444" />
        <rect x="40" y="0" width="16" height="10" rx="2" fill="#00FF66" />
        <rect x="60" y="0" width="16" height="10" rx="2" fill="#eab308" />
        <rect x="80" y="0" width="16" height="10" rx="2" fill="#38BDF8" />
        <rect x="100" y="0" width="16" height="10" rx="2" fill="#a855f7" />
        <rect x="120" y="0" width="16" height="10" rx="2" fill="#00F2FE" />
        <rect x="140" y="0" width="16" height="10" rx="2" fill="#f8fafc" />
      </g>
    </g>

  </g>
</svg>
