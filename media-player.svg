<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="140" fill="none">
  <defs>
    <!-- YouTube Red to Coral Gradient -->
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="100%" stop-color="#FF4E50" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .player-card { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .yt-title { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .yt-artist { font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .yt-badge { font-size: 10px; font-weight: 800; fill: #FF0000; letter-spacing: 1px; }
    .time-text { font-size: 11px; fill: #64748B; font-family: 'Fira Code', monospace; }

    /* Animated Bouncing Equalizer Bars */
    @keyframes eq1 { 0% { height: 4px; } 50% { height: 18px; } 100% { height: 8px; } }
    @keyframes eq2 { 0% { height: 18px; } 50% { height: 6px; } 100% { height: 22px; } }
    @keyframes eq3 { 0% { height: 10px; } 50% { height: 22px; } 100% { height: 14px; } }
    @keyframes eq4 { 0% { height: 22px; } 50% { height: 8px; } 100% { height: 18px; } }
    @keyframes eq5 { 0% { height: 6px; } 50% { height: 16px; } 100% { height: 4px; } }

    .bar { fill: #FF0000; transform-origin: bottom; }
    .bar1 { animation: eq1 1.1s ease-in-out infinite alternate; }
    .bar2 { animation: eq2 0.85s ease-in-out infinite alternate; }
    .bar3 { animation: eq3 1.3s ease-in-out infinite alternate; }
    .bar4 { animation: eq4 0.95s ease-in-out infinite alternate; }
    .bar5 { animation: eq5 1.2s ease-in-out infinite alternate; }
  </style>

  <!-- Base Container -->
  <rect width="540" height="140" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Left Thumbnail / Album Art -->
  <g transform="translate(18, 18)">
    <rect width="104" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- YouTube Red Badge -->
    <rect x="27" y="32" width="50" height="36" rx="8" fill="#FF0000" filter="url(#redGlow)" />
    <polygon points="48,43 48,57 60,50" fill="#FFFFFF"/>
    <!-- Equalizer preview inside thumb -->
    <text x="52" y="86" text-anchor="middle" fill="#64748b" font-size="10" font-family="'Fira Code', monospace">▶ LIVE</text>
  </g>

  <!-- Right Player Info -->
  <g transform="translate(142, 28)">
    <!-- Top Status Header -->
    <circle cx="5" cy="4" r="4" fill="#FF0000" filter="url(#redGlow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="8" class="player-card yt-badge">YOUTUBE // NOW STREAMING</text>

    <!-- Track & Artist -->
    <text x="0" y="34" class="player-card yt-title">Cyberpunk Synthwave &amp; Lo-Fi Beats</text>
    <text x="0" y="52" class="player-card yt-artist">YouTube Music • Deep Coding Radio</text>

    <!-- Equalizer Spectrum (Right aligned) -->
    <g transform="translate(345, 52)">
      <rect class="bar bar1" x="0" y="-18" width="3.5" height="18" rx="1.5"/>
      <rect class="bar bar2" x="6" y="-22" width="3.5" height="22" rx="1.5"/>
      <rect class="bar bar3" x="12" y="-14" width="3.5" height="14" rx="1.5"/>
      <rect class="bar bar4" x="18" y="-20" width="3.5" height="20" rx="1.5"/>
      <rect class="bar bar5" x="24" y="-12" width="3.5" height="12" rx="1.5"/>
    </g>

    <!-- Audio Scrubber & Timers -->
    <g transform="translate(0, 74)">
      <text x="0" y="6" class="time-text">01:48</text>
      <!-- Background Track -->
      <rect x="42" y="1" width="288" height="4" rx="2" fill="#21262d"/>
      <!-- Active Progress Track -->
      <rect x="42" y="1" width="138" height="4" rx="2" fill="url(#progGrad)"/>
      <!-- Scrubber Dot -->
      <circle cx="180" cy="3" r="5" fill="#FF0000" filter="url(#redGlow)"/>
      <text x="340" y="6" class="time-text">03:40</text>
    </g>
  </g>
</svg>