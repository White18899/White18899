<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="60" fill="none">
  <defs>
    <!-- Cyan to Sky-Blue Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <style>
    .rotator-text {
      font-family: 'Fira Code', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace, sans-serif;
      font-size: 21px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      opacity: 0;
      filter: drop-shadow(0 2px 8px rgba(0, 242, 254, 0.45));
    }

    @keyframes rotateCycle {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
      4%, 21% {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
      25%, 100% {
        opacity: 0;
        transform: translateY(-24px) scale(0.96);
      }
    }

    .line-1 { animation: rotateCycle 12s cubic-bezier(0.16, 1, 0.3, 1) infinite 0s; }
    .line-2 { animation: rotateCycle 12s cubic-bezier(0.16, 1, 0.3, 1) infinite 3s; }
    .line-3 { animation: rotateCycle 12s cubic-bezier(0.16, 1, 0.3, 1) infinite 6s; }
    .line-4 { animation: rotateCycle 12s cubic-bezier(0.16, 1, 0.3, 1) infinite 9s; }
  </style>

  <g transform="translate(400, 30)">
    <text class="rotator-text line-1" fill="url(#textGrad)">⚡ Building Next-Gen Web Apps at Vajra Hub</text>
    <text class="rotator-text line-2" fill="url(#textGrad)">🌐 Live Portfolio &amp; Outpost: nithin.akao.in</text>
    <text class="rotator-text line-3" fill="url(#textGrad)">🚀 Full-Stack Developer • Kinetic UI Engineer</text>
    <text class="rotator-text line-4" fill="url(#textGrad)">💡 Turning Complex Logic into Elegant Interfaces</text>
  </g>
</svg>